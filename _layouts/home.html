<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/">
    <link rel="icon" href="{{ site.baseurl }}/favicon.ico">
    <link href="{{ site.baseurl }}/feed.xml" type="application/atom+xml" rel="alternate" title="{{ site.title }} posts">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            line-height: 1.6;
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
            color: #333;
            background: #fff;
        }
        .header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 30px;
        }
        .header-text {
            flex: 1;
        }
        .header img {
            border-radius: 50%;
            width: 260px;
            height: 260px;
            object-fit: cover;
            margin-left: 30px;
            flex-shrink: 0;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
        }
        h2 {
            font-size: 24px;
            margin: 0 0 12px 0;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .links {
            margin: 15px 0;
        }
        .links a, .links span {
            display: block;
            margin: 5px 0;
        }
        .section {
            margin: 30px 0;
        }
        .header .section {
            margin: 20px 0 0 0;
        }
        .section p {
            margin: 0 0 18px 0;
        }
        sup {
            font-size: 0.7em;
            line-height: 0;
        }
        @media (max-width: 600px) {
            body { margin: 30px auto; }
            .header { flex-direction: column-reverse; align-items: center; }
            .header img { margin: 0 0 20px 0; width: 180px; height: 180px; }
            .header-text { width: 100%; }
        }
    </style>
</head>
<body>
{{ content }}
</body>
</html>
